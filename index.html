<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Web interface for managing a local Ollama instance: browse and pull models, create variants, track deployments, chat and monitor CPU, RAM and GPU usage."
    />
    <title>Ollama Web Manager</title>

    <!--
      Resolve the theme before the first paint so dark-mode users never see a
      flash of the light background. Values mirror SURFACES in src/theme/tokens.ts.
    -->
    <script>
      (function () {
        var LIGHT_BG = '#f8fafc';
        var DARK_BG = '#0f172a';
        var mode = null;
        try {
          mode = localStorage.getItem('themeMode');
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            var legacy = localStorage.getItem('darkMode');
            mode = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light' : 'system';
          }
        } catch (error) {
          mode = 'system';
        }

        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
        var root = document.documentElement;

        root.style.colorScheme = isDark ? 'dark' : 'light';
        root.dataset.theme = isDark ? 'dark' : 'light';
        root.style.backgroundColor = isDark ? DARK_BG : LIGHT_BG;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
